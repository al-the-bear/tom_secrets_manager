name: tom_secrets_import_cleaner
description: >-
  tsm_import_cleaner cleans a password manager's export (Enpass, Bitwarden,
  1Password, the browsers' CSV) for testing the Tom Secrets Manager import:
  secrets and personal values replaced, the structure kept. License:
  BSD-3-Clause.
version: 0.1.0
homepage: https://enterprise-flutter.dev
repository: https://github.com/al-the-bear/tom_secrets_manager
publish_to: none

environment:
  sdk: ^3.10.0

executables:
  tsm_import_cleaner: tsm_import_cleaner

dependencies:
  # 1Password's 1PUX is a ZIP.
  archive: ^4.0.0
  # The command line: definitions, parsing, help, exit codes (workspace rule).
  tom_build_base: ^2.35.1

dev_dependencies:
  # The tests check that the core's importers still read a cleaned export
  # with the same items, fields and attachment sizes.
  tom_secrets_core: ^0.2.31
  lints: ^6.0.0
  test: ^1.25.6
