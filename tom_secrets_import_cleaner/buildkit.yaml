# yaml-language-server: $schema=../../../../../../../.tom/json-schema/buildkit/buildkit.schema.json
# Tom Build Configuration for tom_secrets_import_cleaner: tsm_import_cleaner
# is compiled into the binaries folder of each platform, so it is on PATH on
# every machine after the next binaries build.

project_id: TIC
name: tsm_import_cleaner
description: >-
  Cleans a password manager's export for testing the Tom Secrets Manager
  import.
license: BSD-3-Clause

compiler:
  compiles:
    # macOS and Linux: compile for this platform.
    - pipeline:
        - shell mkdir -p $TOM_BINARY_PATH/%{target-platform-vs}
        - shell dart compile exe %{file} --target-os=%{dart-target-os} --target-arch=%{dart-target-arch} -o $TOM_BINARY_PATH/%{target-platform-vs}/tsm_import_cleaner
      files: bin/tsm_import_cleaner.dart
      platforms: [darwin-*, linux-*]

    # Windows: compile for this platform.
    - pipeline:
        - shell dart compile exe %{file} --target-os=%{dart-target-os} --target-arch=%{dart-target-arch} -o $TOM_BINARY_PATH/win32-x64/tsm_import_cleaner.exe
      files: bin/tsm_import_cleaner.dart
      platforms: [win32-*]

  postcompile:
    - pipeline:
        - shell chmod +x $TOM_BINARY_PATH/%{current-platform-vs}/tsm_import_cleaner
      platforms: [macos, linux]
