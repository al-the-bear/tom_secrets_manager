name: tom_secrets_core
description: >-
  The core of the Tom Secrets Manager: secret stores over KDBX files,
  overlays, dimensions and the resolution of secret references, the GitHub
  vault cycle and the outer encryption.
version: 0.2.22
homepage: https://enterprise-flutter.dev
repository: https://github.com/al-the-bear/tom_secrets_manager

environment:
  sdk: ^3.10.0

dependencies:
  # The only way into KDBX (repository rule): the store's own KDBX types.
  tom_kdbx_store: ^0.2.6
  # The storage port and its GitHub backend (the REST API, no clone, DP-81).
  tom_core_storage: ^0.1.2
  # The keyed three-way merge and the sync engine of the GitHub cycle.
  tom_core_sync: ^0.1.0
  # The reference grammar, one implementation for the clients, the core and
  # the service (repository guideline).
  tom_secrets_client: ^0.2.4
  # The shared configuration tsm.config.
  yaml: ^3.1.0
  # 1Password's 1PUX export (a ZIP) read in memory, without extracting it.
  archive: ^4.0.0
  # P-256 for passkey keys: the public key of an imported private key, when
  # its PKCS#8 is written (DP-120).
  pointycastle: ^4.0.0
  # A resolved value held masked and read as bytes zeroed after use
  # (TomProtectedValue).
  tom_crypto: ^1.5.0
  # TOTP codes (HMAC-SHA-1/256/512).
  crypto: ^3.0.6
  # A compaction's push over the git protocol (no git binary), DP-82, and
  # the HTTP client it is given.
  tom_git: ^0.2.0
  http: ^1.2.0
  # The vault repository's commits through the REST API: telling a compaction
  # from a force push, and a compaction's history read (also FakeGitHubServer
  # in the tests).
  tom_github_api: ^1.4.0
  # The outer layer's ciphers, XChaCha20-Poly1305 and AES-256-GCM (DP-8, DP-80).
  cryptography: ^2.9.0
  # ML-DSA-65 and ML-KEM-768 (FIPS 204, 203): the signatures of grants and
  # the approval link's handshake (DP-160).
  tom_pqc: ^0.1.0
  # The age format and the member keys, without the vault format (shared
  # with the relay server, which must not reach KDBX).
  tom_secrets_age:
    path: ../tom_secrets_age
  # Typed certificates (part-structure, DP-179): X.509 certificates, CSRs
  # and their keys generated (ECDSA P-384, RSA 4096) and read (notAfter,
  # the key's length); MIT.
  basic_utils: ^5.8.2
  # Typed PGP keys: OpenPGP keys generated (ECDSA P-384, RSA 4096) and read
  # (fingerprint, expiry, the key's length); BSD-3.
  dart_pg: ">=2.1.0 <2.2.0"
  # The health report's password strength: zxcvbn's estimator (dictionaries,
  # patterns, keyboard walks), MIT, no dependencies.
  zxcvbn: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
