name: tom_secrets_core
description: >-
  The core of the Tom Secrets Manager: stores over KDBX files, the metadata
  entry and the shared configuration, dimensions with their priority and
  fallback, overlays, and the resolution of secret references. License:
  BSD-3-Clause.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  # The only way into KDBX (repository rule): the store's own KDBX types.
  tom_kdbx_store: ^0.2.1
  # The reference grammar, one implementation for the clients, the core and
  # the service (repository guideline). From this workspace until
  # tom_secrets_client is published (tsm_a22), then by version.
  tom_secrets_client:
    path: ../../secrets_clients/clients/dart/tom_secrets_client
  # The shared configuration tsm.config.
  yaml: ^3.1.0
  # TOTP codes (HMAC-SHA-1/256/512).
  crypto: ^3.0.6

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
