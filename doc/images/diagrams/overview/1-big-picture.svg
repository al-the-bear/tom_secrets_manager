<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Tom Secrets Manager in one picture" font-family="Inter, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" data-tsm-source="5d753ea4e4cf65fc"><title>Tom Secrets Manager in one picture</title><desc>This diagram shows the main pieces: people and programs on each machine, one service per machine, and the vaults in private GitHub repositories.</desc>
  <defs>
    <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#41576C"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7FB0"/></marker>
    <marker id="a-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A02B93"/></marker>
    <style>
      .title { font-size: 14px; font-weight: 700; letter-spacing: .04em; fill: #0E2841; }
      .heading { font-size: 15px; font-weight: 700; fill: #0E2841; }
      .heading-w { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .caption { font-size: 11.5px; fill: #41576C; }
      .caption-w { font-size: 11.5px; fill: #B9CCDC; }
      .edge { font-size: 11.5px; fill: #41576C; }
      .edge-m { font-size: 11.5px; fill: #7A2186; }
      .edge-b { font-size: 11.5px; fill: #0F7FB0; font-weight: 600; }
      .vault { font-size: 13px; font-weight: 700; fill: #1F7A2E; }
      .vault-c { font-size: 11.5px; fill: #1F7A2E; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="560" rx="22" fill="#F4F8FB"/>

  <!-- Each desktop or server -->
  <rect x="24" y="24" width="636" height="512" rx="18" fill="#FFFFFF" stroke="#C9D8E4" stroke-width="1.6"/>
  <text class="title" x="48" y="56">EACH DESKTOP OR SERVER</text>

  <rect x="56" y="88" width="260" height="64" rx="12" fill="#EAF4FA" stroke="#BFD9EA"/>
  <text class="heading" x="78" y="116">The user</text>
  <text class="caption" x="78" y="136">unlocks once, approves, edits</text>

  <rect x="56" y="226" width="260" height="72" rx="12" fill="#0E2841"/>
  <text class="heading-w" x="78" y="256">Manager app</text>
  <text class="caption-w" x="78" y="277">password manager · approvals · sharing</text>

  <rect x="56" y="420" width="260" height="72" rx="12" fill="#EAF4FA" stroke="#BFD9EA"/>
  <text class="heading" x="78" y="450">Programs</text>
  <text class="caption" x="78" y="471">scripts · ssh · git · the browser</text>

  <rect x="388" y="318" width="244" height="84" rx="12" fill="#0E2841"/>
  <text class="heading-w" x="410" y="352">Secrets service</text>
  <text class="caption-w" x="410" y="374">the unlocked vaults, in memory</text>

  <line x1="186" y1="152" x2="186" y2="222" stroke="#41576C" stroke-width="1.6" marker-end="url(#a-slate)"/>
  <path d="M316,262 H510 V314" fill="none" stroke="#A02B93" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a-magenta)"/>
  <text class="edge-m" x="340" y="252">unlocks, approves</text>
  <path d="M316,456 H510 V406" fill="none" stroke="#41576C" stroke-width="1.6" marker-end="url(#a-slate)"/>
  <text class="edge" x="340" y="446">ask by reference</text>

  <!-- A phone -->
  <rect x="684" y="24" width="292" height="176" rx="18" fill="#FFFFFF" stroke="#C9D8E4" stroke-width="1.6"/>
  <text class="title" x="708" y="56">A PHONE</text>
  <rect x="708" y="80" width="244" height="80" rx="12" fill="#0E2841"/>
  <text class="heading-w" x="730" y="112">Mobile app</text>
  <text class="caption-w" x="730" y="133">the vaults in memory while open</text>

  <!-- GitHub -->
  <rect x="684" y="232" width="292" height="304" rx="18" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.6"/>
  <text class="title" x="708" y="264">GITHUB</text>
  <path d="M730,330 v128 a100,16 0 0 0 200,0 v-128" fill="#E7F6EC" stroke="#9ED9AE" stroke-width="1.4"/>
  <ellipse cx="830" cy="330" rx="100" ry="16" fill="#E7F6EC" stroke="#9ED9AE" stroke-width="1.4"/>
  <text class="vault" x="830" y="390" text-anchor="middle">Vaults</text>
  <text class="vault-c" x="830" y="411" text-anchor="middle">encrypted KDBX files</text>
  <text class="vault-c" x="830" y="429" text-anchor="middle">in private repositories</text>

  <path d="M632,380 H724" fill="none" stroke="#0F7FB0" stroke-width="1.8" marker-end="url(#a-blue)"/>
  <text class="edge-b" x="662" y="370">sync</text>
  <line x1="830" y1="160" x2="830" y2="308" stroke="#0F7FB0" stroke-width="1.8" marker-end="url(#a-blue)"/>
  <text class="edge-b" x="840" y="222">sync</text>
</svg>
