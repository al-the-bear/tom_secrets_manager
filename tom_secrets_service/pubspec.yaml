name: tom_secrets_service
description: >-
  The secrets service of the Tom Secrets Manager: a background process that
  holds one user's unlocked vaults and answers local clients, the manager
  app and tsm.
version: 0.25.7
homepage: https://enterprise-flutter.dev
repository: https://github.com/al-the-bear/tom_secrets_manager

environment:
  sdk: ^3.10.0

executables:
  tom_secrets_service: tom_secrets_service

dependencies:
  # Vaults, stores, resolution, the vault cycle (the only way into KDBX goes
  # through the core and tom_kdbx_store).
  tom_secrets_core:
    path: ../tom_secrets_core
  # Frames, the strict JSON, discovery and the reference grammar: one
  # implementation for the clients and the service (repository guideline).
  tom_secrets_client: ^0.2.20
  tom_core_storage: ^0.1.2
  # The vault unit's push failures (TomCasExhaustedException, ...).
  tom_core_sync: ^0.1.0
  # The git remote a compaction pushes to (`compact`).
  tom_git: ^0.2.0
  # The GitHub client the github: opener reaches GitHub through.
  tom_github_api: ^1.4.0
  http: ^1.2.0
  # The storage's diagnostics: a fetch GitHub did not answer.
  tom_basics: ^3.3.0
  # Secrets held masked and read as bytes zeroed after use (memory hygiene).
  tom_crypto: ^1.5.0
  # HMAC-SHA256 of the admin challenge.
  crypto: ^3.0.6
  # XChaCha20-Poly1305 of the audit log's records.
  cryptography: ^2.9.0
  # The idle time, the process hardening (prctl, setrlimit, the Windows
  # process DACL) and the Windows calls through FFI.
  ffi: ^2.1.0
  # bootstrap.yaml.
  yaml: ^3.1.0

dev_dependencies:
  # Tests build demo vaults with the KDBX types directly; the package itself
  # reaches KDBX only through tom_secrets_core (DP-29).
  tom_kdbx_store: ^0.2.5
  lints: ^6.0.0
  test: ^1.25.6
